name: pass_point
description: A new Flutter project.
publish_to: "none" # Remove this line if you wish to publish to pub.dev

version: 1.0.1+28

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_bloc: ^9.1.1
  equatable: ^2.0.8
  firebase_core: ^4.2.1
  cloud_firestore: ^6.1.0
  firebase_auth: ^6.1.2
  camera: ^0.11.3
  image_picker: ^1.2.0
  cloudinary_public: ^0.23.1
  path_provider: ^2.1.5
  csv: ^6.0.0
  uuid: ^4.5.2
  flutter_dotenv: ^6.0.0
  intl: ^0.20.2
  signature: ^6.3.0
  shared_preferences: ^2.5.4
  carousel_slider: ^5.1.1
  google_mlkit_face_detection: ^0.13.1
  tflite_flutter: ^0.12.1
  image: ^4.5.4
  flutter_web_auth_2: ^5.0.1
  isar: ^3.1.0+1
  isar_flutter_libs: ^3.1.0+1
  isar_generator: ^3.1.0+1
  build_runner: ^2.4.13
  cloud_functions: ^6.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_logo.jpg" # Make sure this path is correct
  min_sdk_android: 21

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/icon/app_logo.jpg # Include your logo here


